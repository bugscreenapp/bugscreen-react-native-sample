name: Check sample
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - run: npx --yes expo-doctor
  android:
    name: Android native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      ATC_SESSION_ID: bugscreen-standalone-sample-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx expo prebuild --no-install --platform android
      - name: Assemble arm64 development APK
        run: npx --yes --package @rock3r/atc@3.3.0 atc exec gradle tasks :app:assembleDebug --workspace android --property reactNativeArchitectures=arm64-v8a --wait 60
      - uses: actions/upload-artifact@v7
        with:
          name: bugscreen-travel-android
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk
